name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # PRs from forks don't get secrets; those builds fall back to an unshared debug key.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SONARA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sonara.keystore"
          echo "SONARA_KEYSTORE_FILE=$RUNNER_TEMP/sonara.keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        working-directory: android
        env:
          SONARA_KEYSTORE_PASSWORD: ${{ secrets.SONARA_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Sonara-debug.apk
          cp android/app/build/outputs/apk/release/app-release*.apk dist/Sonara-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonara-apks
          path: dist/*.apk

      # Rolling download link for phones: /releases/tag/android-latest
      - name: Publish android-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/*.apk --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android latest (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA}. Install Sonara-release.apk (or -debug). Same signing key every build, so it updates in place."
